name: C++ CI Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ libboost-system-dev nlohmann-json3-dev python3

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Run unit tests
      run: ctest --test-dir build --output-on-failure -V -R unit_tests

    - name: Run functional tests
      run: ctest --test-dir build --output-on-failure -V -R functional_tests
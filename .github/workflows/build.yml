name: C++ CI Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ libboost-system-dev nlohmann-json3-dev python3 qt6-base-dev

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Build Qt GUI (aes67_gui)
      run: cmake --build build --target aes67_gui --config Release

    - name: Smoke-test Qt GUI (offscreen)
      run: QT_QPA_PLATFORM=offscreen timeout 5 ./build/aes67_gui || test $? -eq 124

    - name: Render GUI screenshot artifact
      run: QT_QPA_PLATFORM=offscreen ./build/aes67_gui --screenshot gui_screenshot.png

    - name: Upload GUI screenshot
      uses: actions/upload-artifact@v4
      with:
        name: gui-screenshot
        path: gui_screenshot.png
        retention-days: 14
        if-no-files-found: error

    - name: Run unit tests
      run: ctest --test-dir build --output-on-failure -V -R unit_tests

    - name: Run functional tests
      run: ctest --test-dir build --output-on-failure -V -R functional_tests

    - name: Upload Linux binaries as artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-binaries
        path: |
          build/aes67_daemon
          build/aes67_gui
        retention-days: 14
        if-no-files-found: error